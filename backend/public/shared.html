<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Video - Reflect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .branding {
      font-size: 12px;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .video-header {
      margin-bottom: 24px;
    }

    .video-header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .video-channel {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .watch-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .video-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .annotations-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      overflow: hidden;
    }

    .annotations-label {
      flex: 0 0 auto;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #eee;
    }

    .annotations-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .annotation-card {
      display: block;
      width: 100%;
      padding: 14px 16px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: #fff;
      border: 0;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .annotation-card:last-child { border-bottom: 0; }

    .annotation-card:hover,
    .annotation-card:focus-visible { background: #fafafa; outline: none; }

    .annotation-card:focus-visible { box-shadow: inset 3px 0 0 #f44336; }

    .annotation-card.active {
      background: #fff5f4;
      box-shadow: inset 3px 0 0 #f44336;
    }

    .annotation-timestamp {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #e64536;
      background: #fef2f2;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 7px;
      font-variant-numeric: tabular-nums;
    }

    .annotation-text {
      font-size: 14px;
      line-height: 1.45;
      color: #333;
      word-break: break-word;
    }

    .annotation-date {
      font-size: 11px;
      color: #aaa;
      margin-top: 7px;
    }

    .empty-annotations {
      padding: 24px 16px;
      color: #999;
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 800px) {
      .watch-layout { grid-template-columns: 1fr; }
      .annotations-panel { max-height: 360px; }
    }

    .loading, .error-msg {
      text-align: center;
      padding: 80px 24px;
      color: #999;
      font-size: 15px;
    }

    .error-msg { color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <div class="branding">Reflect</div>

    <div id="loading-state" class="loading">Loading...</div>
    <div id="error-state" class="error-msg" style="display:none"></div>

    <div id="main-content" style="display:none">
      <div class="video-header">
        <h1 id="video-title"></h1>
        <div class="video-channel" id="video-channel"></div>
      </div>

      <div class="watch-layout">
        <div class="video-embed">
          <div id="yt-player"></div>
        </div>

        <aside class="annotations-panel" aria-label="Video annotations">
          <div class="annotations-label" id="annotations-label"></div>
          <div class="annotations-list" id="annotations-list"></div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var API_BASE = window.location.origin;

      var loadingState = document.getElementById('loading-state');
      var errorState = document.getElementById('error-state');
      var mainContent = document.getElementById('main-content');
      var videoTitle = document.getElementById('video-title');
      var videoChannel = document.getElementById('video-channel');
      var annotationsList = document.getElementById('annotations-list');
      var annotationsLabel = document.getElementById('annotations-label');
      var ytPlayer = null;
      var playerReady = false;
      var annotationCards = [];
      var activeCard = null;
      var playbackTimer = null;

      function showState(el) {
        [loadingState, errorState, mainContent].forEach(function(e) {
          e.style.display = 'none';
        });
        el.style.display = '';
      }

      // Extract token from URL path /s/:token
      var pathParts = window.location.pathname.split('/');
      var token = pathParts[pathParts.length - 1];

      if (!token) {
        errorState.textContent = 'Invalid share link.';
        showState(errorState);
        return;
      }

      function extractVideoId(url) {
        try {
          var u = new URL(url);
          return u.searchParams.get('v');
        } catch(e) { return null; }
      }

      function formatTimestamp(seconds) {
        var h = Math.floor(seconds / 3600);
        var m = Math.floor((seconds % 3600) / 60);
        var s = Math.floor(seconds % 60);
        if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function formatDate(iso) {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function activateCard(card, shouldScroll) {
        if (!card || activeCard === card) return;
        if (activeCard) activeCard.element.classList.remove('active');
        activeCard = card;
        card.element.classList.add('active');
        if (shouldScroll) {
          card.element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }

      function updateActiveAnnotation() {
        if (!ytPlayer || !playerReady || !annotationCards.length) return;
        var currentTime = ytPlayer.getCurrentTime();
        var latestPassed = null;
        annotationCards.forEach(function(card) {
          if (card.timestamp <= currentTime) latestPassed = card;
        });
        if (latestPassed) activateCard(latestPassed, true);
      }

      function startPlaybackTracking() {
        if (playbackTimer) return;
        updateActiveAnnotation();
        playbackTimer = window.setInterval(updateActiveAnnotation, 400);
      }

      function stopPlaybackTracking() {
        if (!playbackTimer) return;
        window.clearInterval(playbackTimer);
        playbackTimer = null;
      }

      function initPlayer(vidId) {
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = function() {
          ytPlayer = new YT.Player('yt-player', {
            videoId: vidId,
            playerVars: { rel: 0, modestbranding: 1 },
            events: {
              onReady: function() {
                playerReady = true;
                updateActiveAnnotation();
              },
              onStateChange: function(event) {
                if (event.data === 1) startPlaybackTracking();
                else stopPlaybackTracking();
              }
            }
          });
        };
      }

      function seekTo(seconds) {
        if (ytPlayer && playerReady) {
          ytPlayer.seekTo(seconds, true);
          ytPlayer.playVideo();
          updateActiveAnnotation();
        }
      }

      document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' && !e.target.matches('input, textarea, [contenteditable]')) {
          e.preventDefault();
          if (!ytPlayer || !playerReady) return;
          var state = ytPlayer.getPlayerState();
          if (state === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
          } else {
            ytPlayer.playVideo();
          }
        }
      });

      fetch(API_BASE + '/api/shared-video/' + token)
        .then(function(resp) {
          if (resp.status === 403) {
            errorState.textContent = 'This video is not publicly shared.';
            showState(errorState);
            return null;
          }
          if (resp.status === 404) {
            errorState.textContent = 'Share link not found.';
            showState(errorState);
            return null;
          }
          return resp.json();
        })
        .then(function(data) {
          if (!data) return;

          var vidId = extractVideoId(data.video_url);
          videoTitle.textContent = data.title || 'YouTube Video (' + vidId + ')';
          if (data.channel) videoChannel.textContent = data.channel;
          document.title = videoTitle.textContent + ' - Reflect';

          initPlayer(vidId);

          var annotations = (data.annotations || []).slice().sort(function(a, b) {
            return Number(a.timestamp_seconds) - Number(b.timestamp_seconds) ||
              new Date(a.created_at) - new Date(b.created_at);
          });
          annotationsLabel.textContent = annotations.length + ' Annotation' + (annotations.length !== 1 ? 's' : '');

          if (!annotations.length) {
            var empty = document.createElement('div');
            empty.className = 'empty-annotations';
            empty.textContent = 'No annotations have been shared for this video.';
            annotationsList.appendChild(empty);
          }

          annotations.forEach(function(ann) {
            var cardElement = document.createElement('button');
            cardElement.type = 'button';
            cardElement.className = 'annotation-card';
            cardElement.setAttribute('aria-label', 'Play from ' + formatTimestamp(ann.timestamp_seconds));
            var card = { element: cardElement, timestamp: Number(ann.timestamp_seconds) };
            annotationCards.push(card);

            var ts = document.createElement('div');
            ts.className = 'annotation-timestamp';
            ts.textContent = formatTimestamp(ann.timestamp_seconds);
            cardElement.appendChild(ts);

            var text = document.createElement('div');
            text.className = 'annotation-text';
            text.textContent = ann.annotation;
            cardElement.appendChild(text);

            var date = document.createElement('div');
            date.className = 'annotation-date';
            date.textContent = formatDate(ann.created_at);
            cardElement.appendChild(date);

            cardElement.addEventListener('click', function() {
              activateCard(card, false);
              seekTo(card.timestamp);
              if (window.innerWidth <= 800) {
                document.querySelector('.video-embed').scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            });

            annotationsList.appendChild(cardElement);
          });

          updateActiveAnnotation();

          showState(mainContent);
        })
        .catch(function() {
          errorState.textContent = 'Failed to load. Please try again.';
          showState(errorState);
        });
    })();
  </script>
</body>
</html>
