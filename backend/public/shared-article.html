<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Article - Reflect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .branding {
      font-size: 12px;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .article-header {
      margin-bottom: 32px;
    }

    .article-header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .article-meta {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .article-meta a {
      color: #666;
      text-decoration: none;
    }

    .article-meta a:hover {
      color: #333;
      text-decoration: underline;
    }

    .meta-dot {
      color: #ccc;
    }

    .highlights-label {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 900px) {
      .highlights-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 580px) {
      .highlights-grid {
        grid-template-columns: 1fr;
      }
    }

    .highlight-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .highlight-card:hover {
      border-color: #ccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .highlight-text {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #292524;
      word-break: break-word;
    }

    .highlight-annotation {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #57534e;
    }

    .highlight-date {
      margin-top: 8px;
      font-size: 11px;
      color: #bbb;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 80px 24px;
      color: #999;
      font-size: 15px;
    }

    .error-msg { color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <div class="branding">Reflect</div>

    <div id="loading-state" class="loading">Loading...</div>
    <div id="error-state" class="error-msg" style="display:none"></div>

    <div id="main-content" style="display:none">
      <div class="article-header">
        <h1 id="article-title"></h1>
        <div class="article-meta">
          <a id="article-source" href="#" target="_blank" rel="noopener"></a>
          <span class="meta-dot">&middot;</span>
          <span id="article-count"></span>
        </div>
      </div>

      <div class="highlights-label" id="highlights-label"></div>
      <div class="highlights-grid" id="highlights-grid"></div>
    </div>
  </div>

  <script>
    (function() {
      var API_BASE = window.location.origin;

      var loadingState = document.getElementById('loading-state');
      var errorState = document.getElementById('error-state');
      var mainContent = document.getElementById('main-content');
      var articleTitle = document.getElementById('article-title');
      var articleSource = document.getElementById('article-source');
      var articleCount = document.getElementById('article-count');
      var highlightsGrid = document.getElementById('highlights-grid');
      var highlightsLabel = document.getElementById('highlights-label');

      function showState(el) {
        [loadingState, errorState, mainContent].forEach(function(e) {
          e.style.display = 'none';
        });
        el.style.display = '';
      }

      var pathParts = window.location.pathname.split('/');
      var token = pathParts[pathParts.length - 1];

      if (!token) {
        errorState.textContent = 'Invalid share link.';
        showState(errorState);
        return;
      }

      function extractDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, '');
        } catch(e) { return url; }
      }

      function formatDate(iso) {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }

      fetch(API_BASE + '/api/shared-article/' + token)
        .then(function(resp) {
          if (resp.status === 403) {
            errorState.textContent = 'This article is not publicly shared.';
            showState(errorState);
            return null;
          }
          if (resp.status === 404) {
            errorState.textContent = 'Share link not found.';
            showState(errorState);
            return null;
          }
          return resp.json();
        })
        .then(function(data) {
          if (!data) return;

          var titleText = data.title || extractDomain(data.url);
          articleTitle.textContent = titleText;
          document.title = titleText + ' - Reflect';

          var domain = data.domain || extractDomain(data.url);
          articleSource.textContent = domain;
          articleSource.href = data.url;

          var highlights = data.highlights || [];
          articleCount.textContent = highlights.length + ' highlight' + (highlights.length !== 1 ? 's' : '');
          highlightsLabel.textContent = highlights.length + ' Highlight' + (highlights.length !== 1 ? 's' : '');

          highlights.forEach(function(h) {
            var card = document.createElement('div');
            card.className = 'highlight-card';

            var text = document.createElement('div');
            text.className = 'highlight-text';
            text.appendChild(document.createTextNode(h.text));
            card.appendChild(text);

            if (h.annotation) {
              var ann = document.createElement('div');
              ann.className = 'highlight-annotation';
              ann.appendChild(document.createTextNode(h.annotation));
              card.appendChild(ann);
            }

            var date = document.createElement('div');
            date.className = 'highlight-date';
            date.textContent = formatDate(h.created_at);
            card.appendChild(date);

            highlightsGrid.appendChild(card);
          });

          showState(mainContent);
        })
        .catch(function() {
          errorState.textContent = 'Failed to load. Please try again.';
          showState(errorState);
        });
    })();
  </script>
</body>
</html>
